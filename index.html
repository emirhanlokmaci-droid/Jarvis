<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  body { background: #000; color: #00e5ff; font-family: 'Orbitron', sans-serif; margin: 0; overflow: hidden; }
  
  /* Ana HUD Yapısı */
  .hud-container { display: flex; justify-content: space-between; align-items: center; height: 100vh; padding: 20px; }
  
  /* Ortadaki Şekil */
  .center-orb { width: 400px; height: 400px; border: 3px solid #00e5ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; animation: rotate 20s linear infinite; }
  .center-orb::before { content: "J.A.R.V.I.S."; font-size: 2rem; letter-spacing: 5px; text-shadow: 0 0 15px #00e5ff; }
  @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Sağ-Sol Paneller */
  .panel { width: 300px; height: 80vh; background: rgba(0, 50, 80, 0.2); border: 1px solid #00e5ff; padding: 20px; font-size: 0.9rem; }
  
  .data-line { margin-bottom: 15px; border-bottom: 1px solid #00e5ff33; padding-bottom: 5px; }
  
  #chat-box { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 600px; text-align: center; font-size: 1.2rem; text-shadow: 0 0 5px #fff; }
</style>
</head>
<body>

<div class="hud-container">
  <!-- Sol Panel -->
  <div class="panel">
    <div class="data-line">SİSTEM DURUMU: AKTİF</div>
    <div class="data-line" id="date-time">TARİH/SAAT</div>
    <div class="data-line" id="weather">HAVA: KONTROL EDİLİYOR...</div>
  </div>

  <!-- Merkez -->
  <div class="center-orb"></div>

  <!-- Sağ Panel -->
  <div class="panel">
    <div class="data-line">İŞLEMCİ: %12</div>
    <div class="data-line">AĞ: OPTİMUM</div>
    <div class="data-line">BİLİNÇ: %100</div>
  </div>
</div>

<div id="chat-box">Sistem dinlemede...</div>

<script>
  // 1. Sürekli Dinleme (Sürekli dinleme için SpeechRecognition)
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SpeechRec();
  rec.continuous = true;
  rec.interimResults = false;
  rec.lang = 'tr-TR';

  rec.onresult = (e) => {
    const txt = e.results[e.results.length - 1][0].transcript;
    document.getElementById('chat-box').innerText = "Siz: " + txt;
    askJarvis(txt);
  };
  rec.start(); // Sayfa açılınca otomatik başlar

  // 2. Jarvis Mantığı
  async function askJarvis(q) {
    const apiKey = localStorage.getItem('GEMINI_API_KEY');
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: `Sen sadık, zeki ve kişisel bir asistansın. Tony Stark takıntın yok. Soru: ${q}` }] }] })
    });
    const data = await res.json();
    const reply = data.candidates[0].content.parts[0].text;
    document.getElementById('chat-box').innerText = "Jarvis: " + reply;
    
    // Seslendirme
    const msg = new SpeechSynthesisUtterance(reply);
    msg.lang = 'tr-TR';
    window.speechSynthesis.speak(msg);
  }

  // 3. Gösterge Güncellemeleri
  setInterval(() => {
    document.getElementById('date-time').innerText = new Date().toLocaleString('tr-TR');
  }, 1000);
</script>
</body>
</html>
